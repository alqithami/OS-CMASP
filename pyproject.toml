[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-cmasp"
version = "0.0.29"
description = "OS-CMASP manuscript and Berth-1-Conflict fixed-solver scaffold"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OS-CMASP authors"}]
license = {text = "License decision pending"}

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.8"]

[project.scripts]
berth1-conflict = "os_cmasp.berth1_conflict:main"

[tool.setuptools.packages.find]
where = ["src"]
