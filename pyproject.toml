[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-cmasp"
version = "0.0.30"
description = "OS-CMASP manuscript and Berth-1-Conflict fixed-solver scaffold"
requires-python = ">=3.10"
authors = [{name = "OS-CMASP contributors"}]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
os-cmasp-berth1 = "os_cmasp.berth1_conflict:main"
