[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-cmasp"
version = "0.0.34"
description = "OS-CMASP manuscript, Berth-1 promotion gates, and no-manual maritime twin replay adapters"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "OS-CMASP authors", email = "replace-with-contact@example.com"}
]
license = {text = "License not yet selected; see docs/LICENSING_DECISION.md"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
berth1-conflict = "os_cmasp.berth1_conflict:main"
berth1-replay-adapter = "os_cmasp.berth1_replay_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
